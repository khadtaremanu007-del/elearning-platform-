
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elearning-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elearning
  template:
    metadata:
      labels:
        app: elearning
    spec:
      containers:
        - name: elearning-container
          image: elearning-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
